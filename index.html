<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>31 Nights of Horror</title><style>
:root{--bg:#0b0b0d;--card:#17171b;--ink:#f4efe7;--muted:#aaa;--red:#b52025;--orange:#d87520}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#241014,#0b0b0d 38%);color:var(--ink);font:15px system-ui,sans-serif}header{padding:34px 18px 18px;text-align:center}h1{margin:0;font-size:clamp(32px,7vw,68px);letter-spacing:2px}header p{color:#ccc}.setup{position:fixed;inset:0;background:#09090cf2;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.setup.hidden{display:none}.setupbox{max-width:560px;width:100%;background:#18181d;border:1px solid #444;border-radius:22px;padding:24px}.setupbox h2{font-size:30px;margin:0 0 8px}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;background:#24242a;color:white;border:1px solid #444;border-radius:12px;padding:11px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{background:#24242a;border:1px solid #3b3b42;border-radius:12px;padding:10px}.profile{font-size:12px;color:#bbb}.controls{max-width:1100px;margin:auto;padding:12px 18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}button,select{background:#24242a;color:white;border:1px solid #444;border-radius:999px;padding:10px 15px;cursor:pointer}button.primary{background:var(--red);border-color:var(--red)}.grid{max-width:1100px;margin:12px auto 60px;padding:0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:linear-gradient(145deg,#1c1c21,#121215);border:1px solid #303036;border-radius:18px;padding:16px;min-height:220px;position:relative}.card.done{opacity:.58}.day{font-weight:800;color:#ff9a45;text-transform:uppercase;font-size:12px;letter-spacing:1.4px}.title{font-size:21px;font-weight:800;margin:7px 0}.meta,.tags{color:#bbb;font-size:13px}.service{display:inline-block;margin:9px 5px 9px 0;padding:5px 8px;background:#302329;border-radius:8px;font-size:12px}.rating{font-size:12px;margin-top:9px}.card button{padding:7px 10px;font-size:12px;margin-top:10px;margin-right:5px}.swapfilters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.swaplist{max-height:55vh;overflow:auto;display:grid;gap:8px}.swapitem{border:1px solid #38383f;border-radius:12px;padding:11px}.swapitem b{font-size:16px}.tiny{font-size:12px;color:#aaa}.footer{text-align:center;color:#777;padding:20px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#18181d;border:1px solid #444;border-radius:20px;max-width:520px;width:100%;padding:22px}.box h2{margin-top:0}.close{float:right}.big{font-size:26px;font-weight:900;color:#ff9a45}.artbtn{background:transparent;border-color:#333;color:#777;font-size:11px;padding:7px 10px}.arttakeover{text-align:center}.artface{font-size:74px;line-height:1;margin:8px 0}.arttitle{font-size:31px;font-weight:1000;letter-spacing:1px;color:#fff}.blood{color:#e52b34;font-weight:900}.terrifierPulse{animation:pulse .65s ease-in-out 2}@keyframes pulse{50%{transform:scale(1.035);filter:brightness(1.35)}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.card{min-height:245px;padding:13px}.title{font-size:17px}}
</style></head><body><div id='setup' class='setup hidden'><div class='setupbox'><h2>Welcome to 31 Nights of Horror 🎃</h2><p>Build your own October horror marathon. Your choices stay on this browser.</p><div class='field'><label>Your name</label><input id='name1' placeholder='e.g. Sam'></div><div class='field'><label>Watching with <span class='tiny'>(optional)</span></label><input id='name2' placeholder='e.g. Alex'></div><div class='field'><label>Which services do you have?</label><div class='checks' id='serviceChecks'></div></div><button class='primary' onclick='saveProfile()'>BUILD MY OCTOBER →</button></div></div><header><h1>31 NIGHTS OF HORROR</h1><p id='subtitle'>Your October Horror Planner 🎃</p></header><div class='controls'><button class='primary' onclick='nightmare()'>🎲 Pick Our Nightmare</button><select id='mood'><option value='all'>Any nightmare</option><option value='fun'>Make me laugh</option><option value='scary'>Scare me</option><option value='bloody'>Something bloody</option><option value='classic'>Classic horror</option></select><button onclick='resetAll()'>Reset watched</button><button onclick='editProfile()'>⚙️ My services</button><span id='profileLabel' class='profile'></span></div><main id='grid' class='grid'></main><div class='footer'>Streaming availability changes. Services shown are a planning aid; verify before movie night.</div><div id='modal' class='modal' onclick='if(event.target===this)closeM()'><div class='box'><button class='close' onclick='closeM()'>✕</button><div id='modalContent'></div></div></div><script>
const movies=[
['The Menu',107,'Horror comedy','Disney+','fun',2,2],['The Purge',85,'Dystopian thriller','Netflix • Prime • Crave','scary',3,3],['A Haunting in Venice',104,'Gothic mystery','Prime • Disney+','classic',2,1],['The Boogeyman',98,'Supernatural','Prime • Disney+','scary',3,1],['The Omen (2006)',110,'Occult','Disney+','scary',3,2],['It Follows',101,'Supernatural','Prime • Crave','scary',4,2],['It (2017)',135,'Monster','Prime • Crave','scary',4,3],['Burnt Offerings',116,'Haunted house','Prime','classic',3,1],['Rocky Horror Picture Show',98,'Musical horror comedy','Disney+','fun',1,1],['Alien',117,'Sci-fi horror','Disney+','classic',4,3],['Jennifer’s Body',107,'Horror comedy','Netflix • Disney+ • Crave','fun',2,3],['Ready or Not',95,'Horror comedy','Disney+ • Crave • Tubi','bloody',3,4],['The Cabin in the Woods',95,'Meta horror','Netflix • Crave','fun',3,4],['Final Destination: Bloodlines',110,'Supernatural gore','Crave','bloody',3,5],['A Nightmare on Elm Street',91,'Slasher','Crave','classic',4,4],['The Evil Dead',85,'Demonic','Crave','classic',4,5],['Companion',97,'Tech horror','Netflix • Crave','scary',3,3],['The Craft',101,'Witchy horror','Netflix • Crave','fun',2,1],['The Exorcist',122,'Possession','Crave / Apple rental','classic',5,3],['Scream',111,'Slasher','Prime / Apple rental','classic',4,4],['Halloween',91,'Slasher','Prime / Apple rental','classic',4,4],['The Conjuring',112,'Haunting','Crave / Apple rental','scary',5,2],['Hereditary',127,'Psychological occult','Prime / Apple rental','scary',5,4],['Talk to Me',95,'Supernatural','Prime / Apple rental','scary',5,3],['The Ring',115,'Supernatural','Prime / Apple rental','scary',4,1],['Barbarian',102,'Horror thriller','Disney+ / Apple rental','scary',5,4],['Fresh',114,'Horror comedy','Disney+','bloody',3,4],['The First Omen',119,'Occult','Disney+','scary',4,3],['No One Will Save You',93,'Sci-fi horror','Disney+','scary',4,2],['Prey',100,'Creature/action horror','Disney+','bloody',3,4],['The Sixth Sense',107,'Supernatural thriller','Disney+','classic',3,1],
['1408',105,'Haunted hotel','Tubi','scary',4,1],['Buzzkill',96,'Slasher comedy','Tubi','fun',3,4],['Pet Sematary (1989)',103,'Stephen King supernatural','Tubi','classic',4,3],['X',106,'Slasher','Tubi','bloody',4,5],['Halloween (2007)',111,'Slasher','Tubi','bloody',4,5],['Sleepy Hollow',106,'Gothic horror','Tubi','classic',3,3],['Terrifier',85,'Slasher','Tubi','bloody',4,5],['The Crazies',101,'Outbreak horror','Tubi','scary',4,4],['Wrong Turn (2021)',111,'Backwoods horror','Tubi','bloody',4,5],['Dark Skies',97,'Alien horror','Tubi','scary',4,1]
];
const grid=document.getElementById('grid');
const defaultPlan=Array.from({length:31},(_,i)=>i);
const allServices=['Tubi','Netflix','Crave','Prime','Disney+','Apple'];
let profile=JSON.parse(localStorage.getItem('horrorPublicProfile')||'null');
function serviceOptions(){return (profile?.services?.length?profile.services:allServices)}
function hasService(m){return serviceOptions().some(s=>m[3].includes(s))}
function renderProfile(){let a=profile?.name1||'',b=profile?.name2||'';document.getElementById('subtitle').textContent=a?(b?`${a} + ${b}'s October Horror Marathon 🎃`:`${a}'s October Horror Marathon 🎃`):'Your October Horror Planner 🎃';document.getElementById('profileLabel').textContent=profile?.services?.length?'Using: '+profile.services.join(' • '):'All services'}
function drawSetup(){document.getElementById('name1').value=profile?.name1||'';document.getElementById('name2').value=profile?.name2||'';document.getElementById('serviceChecks').innerHTML=allServices.map(s=>`<label><input type=checkbox value="${s}" ${(profile?.services||allServices).includes(s)?'checked':''}> ${s}</label>`).join('')}
function saveProfile(){let services=[...document.querySelectorAll('#serviceChecks input:checked')].map(x=>x.value);if(!services.length){alert('Pick at least one streaming service.');return}profile={name1:document.getElementById('name1').value.trim(),name2:document.getElementById('name2').value.trim(),services};localStorage.setItem('horrorPublicProfile',JSON.stringify(profile));document.getElementById('setup').classList.add('hidden');renderProfile();render()}
function editProfile(){drawSetup();document.getElementById('setup').classList.remove('hidden')}
function svcSelect(id,label){return `<select id=${id}><option value=all>📺 My services</option>${serviceOptions().map(s=>`<option>${s}</option>`).join('')}</select>`}

let plan=JSON.parse(localStorage.getItem('horrorPublicPlan')||'null')||defaultPlan.slice();
function savePlan(){localStorage.setItem('horrorPublicPlan',JSON.stringify(plan))}
function render(){grid.innerHTML='';plan.forEach((mi,i)=>{let m=movies[mi],done=localStorage.getItem('horrorPublic'+i)==='1';let c=document.createElement('article');c.className='card'+(done?' done':'');c.innerHTML=`<div class=day>October ${i+1}</div><div class=title>${m[0]}</div><div class=meta>${m[1]} min · ${m[2]}</div><span class=service>${m[3]}</span><div class=rating>😱 ${'●'.repeat(m[5])}${'○'.repeat(5-m[5])} &nbsp; 🩸 ${'●'.repeat(m[6])}${'○'.repeat(5-m[6])}</div><button onclick='toggle(${i})'>${done?'✓ Watched':'Mark watched'}</button><button onclick='moodPick(${i})'>🎭 Pick by Mood</button><button onclick='swapMovie(${i})'>🔄 Browse</button>`;grid.appendChild(c)})}
function toggle(i){localStorage.setItem('horrorPublic'+i,localStorage.getItem('horrorPublic'+i)==='1'?'0':'1');render()}
function resetAll(){plan.forEach((_,i)=>localStorage.removeItem('horrorPublic'+i));render()}
function nightmare(){let mood=document.getElementById('mood').value;let pool=plan.map((mi,i)=>[movies[mi],i]).filter(x=>localStorage.getItem('horror'+x[1])!=='1'&&(mood==='all'||x[0][4]===mood));if(!pool.length)pool=plan.map((mi,i)=>[movies[mi],i]);let [m,i]=pool[Math.floor(Math.random()*pool.length)];document.getElementById('modalContent').innerHTML=`<div class=big>TONIGHT'S NIGHTMARE</div><h2>${m[0]}</h2><p>${m[2]} · ${m[1]} minutes</p><p><b>Watch:</b> ${m[3]}</p><p>😱 Scare ${m[5]}/5 &nbsp; 🩸 Gore ${m[6]}/5</p><button class=primary onclick='toggle(${i});closeM()'>We watched it ✓</button>`;document.getElementById('modal').classList.add('show')}

let moodState={};
function moodPick(day){let current=movies[plan[day]];moodState[day]={mood:'all',svc:'all'};document.getElementById('modalContent').innerHTML=`<div class=big>OCTOBER ${day+1}</div><h2>What are we feeling tonight? 🎭</h2><p class=tiny>Current pick: ${current[0]}. Choose a vibe, then let fate decide.</p><div class=swapfilters><select id=pickMood><option value=all>🎲 Surprise us</option><option value=scary>😱 Scare us</option><option value=bloody>🩸 Make it bloody</option><option value=fun>😂 Fun / horror comedy</option><option value=classic>📼 Classic horror</option></select>${svcSelect('pickSvc','My services')}</div><button class=primary onclick='rollMood(${day})'>🎲 Give Us a Movie</button> <button class=artbtn title='Probably nothing.' onclick='terrifierOverride(${day})'>🤡</button><div id=moodResult style='margin-top:16px'></div>`;document.getElementById('modal').classList.add('show')}
function rollMood(day){let mood=document.getElementById('pickMood').value,svc=document.getElementById('pickSvc').value,used=new Set(plan),key=day+'|'+mood+'|'+svc;let pool=movies.map((m,i)=>[m,i]).filter(([m,i])=>i!==plan[day]&&(mood==='all'||m[4]===mood)&&(svc==='all'?hasService(m):m[3].includes(svc))&&!used.has(i));if(!pool.length)pool=movies.map((m,i)=>[m,i]).filter(([m,i])=>i!==plan[day]&&(mood==='all'||m[4]===mood)&&(svc==='all'?hasService(m):m[3].includes(svc)));let out=document.getElementById('moodResult');if(!pool.length){out.innerHTML='<p>No matches for that combo. Try another mood or service.</p>';return}if(!moodState[key]||!moodState[key].bag||!moodState[key].bag.length){let bag=pool.map(x=>x[1]);for(let j=bag.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[bag[j],bag[k]]=[bag[k],bag[j]]}moodState[key]={bag:bag,total:bag.length}}let i=moodState[key].bag.pop(),m=movies[i],remaining=moodState[key].bag.length;out.innerHTML=`<div class=swapitem><div class=big>${m[0]}</div><div>${m[2]} · ${m[1]} min</div><p><b>Watch:</b> ${m[3]}</p><p>😱 Scare ${m[5]}/5 &nbsp; 🩸 Gore ${m[6]}/5</p><p class=tiny>${remaining} unseen option${remaining===1?'':'s'} left in this shuffle before repeats.</p><button class=primary onclick='chooseSwap(${day},${i})'>🎃 Lock It In</button> <button onclick='rollMood(${day})'>🎲 Not feeling it — reroll</button></div>`}


function terrifierOverride(day){let idx=movies.findIndex(m=>m[0]==='Terrifier');let m=movies[idx];let mc=document.getElementById('modalContent');mc.classList.add('terrifierPulse');mc.innerHTML=`<div class=arttakeover><div class=artface>🤡🔪</div><div class=arttitle>FUCK IT.<br><span class=blood>PLAY TERRIFIER.</span></div><p>Decision fatigue has been eliminated.</p><div class=swapitem style='margin-top:16px'><div class=big>${m[0]}</div><div>${m[2]} · ${m[1]} min</div><p><b>Watch:</b> ${m[3]}</p><p>😱 Scare ${m[5]}/5 &nbsp; 🩸 Gore ${m[6]}/5</p></div><button class=primary onclick='chooseSwap(${day},${idx})'>🤡 Obviously. Lock It In.</button> <button onclick='moodPick(${day})'>Fine, restore democracy</button><p class=tiny style='margin-top:18px'>ART THE CLOWN EMERGENCY OVERRIDE • Democracy is optional</p></div>`;setTimeout(()=>mc.classList.remove('terrifierPulse'),1400)}

function swapMovie(day){let current=movies[plan[day]];document.getElementById('modalContent').innerHTML=`<div class=big>SWAP OCTOBER ${day+1}</div><h2>Replace ${current[0]}</h2><div class=swapfilters>${svcSelect('svc','My services').replace('<select id=svc>', `<select id=svc onchange="drawSwaps(${day})">`)}<select id=swapMood onchange='drawSwaps(${day})'><option value=all>Any horror</option><option value=scary>Scare me</option><option value=bloody>Something bloody</option><option value=fun>Make me laugh</option><option value=classic>Classic</option></select></div><div id=swaplist class=swaplist></div>`;document.getElementById('modal').classList.add('show');drawSwaps(day)}
function drawSwaps(day){let svc=document.getElementById('svc')?.value||'all',mood=document.getElementById('swapMood')?.value||'all',used=new Set(plan);let candidates=movies.map((m,i)=>[m,i]).filter(([m,i])=>i!==plan[day]&&(svc==='all'?hasService(m):m[3].includes(svc))&&(mood==='all'||m[4]===mood));candidates.sort(([m,a],[n,b])=>(used.has(a)?1:0)-(used.has(b)?1:0));document.getElementById('swaplist').innerHTML=candidates.map(([m,i])=>`<div class=swapitem><b>${m[0]}</b>${used.has(i)?' <span class=tiny>• already elsewhere this month</span>':''}<div class=tiny>${m[1]} min · ${m[2]} · ${m[3]}</div><div class=tiny>😱 ${m[5]}/5 · 🩸 ${m[6]}/5</div><button class=primary onclick='chooseSwap(${day},${i})'>Choose this movie</button></div>`).join('')||'<p>No matches. Try another filter.</p>'}
function chooseSwap(day,mi){plan[day]=mi;savePlan();closeM();render()}
function closeM(){document.getElementById('modal').classList.remove('show')}
drawSetup(); if(!profile)document.getElementById('setup').classList.remove('hidden'); renderProfile(); render();
</script></body></html>
